<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 920 640" width="920" height="640" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333" />
    </marker>
    <marker id="head-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F6FEB" />
    </marker>
    <marker id="open-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1F6FEB" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- 다크 모드에서도 글씨가 보이도록 흰 배경을 깐다 -->
  <rect x="-20" y="-20" width="920" height="640" fill="#FFFFFF" />

  <!-- 참여자 -->
  <g font-size="15" font-weight="700" fill="#222222" text-anchor="middle">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#F5F5F5" stroke="#666666" />
    <text x="80" y="30">사용자 (브라우저)</text>
    <rect x="240" y="0" width="160" height="50" rx="8" fill="#F5F5F5" stroke="#666666" />
    <text x="320" y="30">앱 서버</text>
    <rect x="480" y="0" width="160" height="50" rx="8" fill="#F5F5F5" stroke="#666666" />
    <text x="560" y="30">구글 인증 서버</text>
    <rect x="720" y="0" width="160" height="50" rx="8" fill="#F5F5F5" stroke="#666666" />
    <text x="800" y="30">구글 API</text>
  </g>

  <!-- 생명선 -->
  <g stroke="#AAAAAA" stroke-dasharray="5 5">
    <line x1="80" y1="50" x2="80" y2="530" />
    <line x1="320" y1="50" x2="320" y2="530" />
    <line x1="560" y1="50" x2="560" y2="530" />
    <line x1="800" y1="50" x2="800" y2="530" />
  </g>

  <!-- 브라우저를 거치는 구간 -->
  <g stroke="#333333" stroke-width="1.5" marker-end="url(#head)">
    <line x1="320" y1="100" x2="80" y2="100" />
    <line x1="80" y1="160" x2="560" y2="160" />
    <line x1="560" y1="220" x2="80" y2="220" />
    <line x1="80" y1="280" x2="320" y2="280" />
  </g>
  <!-- 생명선 위를 지나는 라벨 뒤에 바탕을 깔아 글자가 끊겨 보이지 않게 한다 -->
  <g fill="#FFFFFF">
    <rect x="274" y="136" width="132" height="22" />
    <rect x="254" y="196" width="172" height="22" />
    <rect x="490" y="446" width="180" height="22" />
  </g>
  <g font-size="14" fill="#222222" text-anchor="middle" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">
    <text x="200" y="91">① 구글 로그인으로 리다이렉트 (scope)</text>
    <text x="320" y="151">② 로그인 + 권한 동의</text>
    <text x="320" y="211">③ 앱으로 리다이렉트 + code</text>
    <text x="200" y="271">code 전달</text>
  </g>

  <!-- 앱 서버와 구글이 직접 주고받는 구간 -->
  <g stroke="#1F6FEB" stroke-width="2.5">
    <line x1="320" y1="340" x2="560" y2="340" marker-end="url(#head-blue)" />
    <line x1="560" y1="400" x2="320" y2="400" stroke-dasharray="7 5" marker-end="url(#open-blue)" />
    <line x1="320" y1="470" x2="800" y2="470" marker-end="url(#head-blue)" />
  </g>
  <g font-size="14" fill="#1F6FEB" text-anchor="middle" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">
    <text x="440" y="331">④ code + client secret</text>
    <text x="440" y="391">access token</text>
    <text x="560" y="461">⑤ access token으로 API 호출</text>
  </g>

  <!-- 범례 -->
  <line x1="0" y1="580" x2="50" y2="580" stroke="#333333" stroke-width="1.5" marker-end="url(#head)" />
  <text x="62" y="585" font-size="14" fill="#333333">브라우저를 거침</text>
  <line x1="220" y1="580" x2="270" y2="580" stroke="#1F6FEB" stroke-width="2.5" marker-end="url(#head-blue)" />
  <text x="282" y="585" font-size="14" fill="#1F6FEB">앱 서버와 구글이 직접 주고받음</text>
</svg>
